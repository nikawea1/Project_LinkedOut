<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Лента отговорок — ЛЕНТЯIN</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Golos+Text:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="dist/style.css">
  <script src="js/theme.js"></script>
</head>
<body data-page="feed" data-guard="1">
  
  <input id="sb-toggle" type="checkbox" class="peer sr-only" aria-label="Открыть меню кабинета">
  <aside id="app-sidebar" class="app-sidebar" data-active="feed" aria-label="Боковая панель"></aside>
  <label for="sb-toggle" class="app-overlay" aria-hidden="true"></label>

  <div class="lg:pl-64">
    
    <header id="app-topbar" class="app-topbar" data-title="Лента отговорок и рекордов"></header>

    <main id="main" class="wrap-wide py-6">
      <div class="grid gap-6 lg:grid-cols-[1fr_20rem] xl:grid-cols-[1fr_22rem]">
        
        <section class="min-w-0 space-y-5" aria-label="Лента">
          
          <form id="composer" class="card space-y-3.5 shadow-sm">
            <div class="flex items-center justify-between">
              <label for="post-text" class="label font-bold text-sm">Чем вы сегодня не занимались?</label>
              <span class="badge badge-brand">+10 лень-баллов</span>
            </div>
            <textarea id="post-text" maxlength="280" rows="3" class="input resize-none" placeholder="Поделитесь отговоркой, рекордом по просмотру сериалов или красивым увольнением…"></textarea>
            
            <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
              <div class="flex items-center gap-3">
                <label for="post-type" class="sr-only">Тип записи</label>
                <select id="post-type" class="input w-auto py-1.5 px-3 text-xs sm:text-sm">
                  <option value="excuse">Отговорка</option>
                  <option value="record">Рекорд</option>
                  <option value="fired">Увольнение</option>
                </select>
                <span id="post-count" class="muted text-xs font-mono">0/280</span>
              </div>
              <button id="post-btn" type="submit" class="btn btn-primary" disabled>
                Опубликовать (+10)
              </button>
            </div>
          </form>

          
          <fieldset id="feed-filter" class="flex flex-wrap items-center gap-2">
            <legend class="sr-only">Фильтр по категориям</legend>
            <span class="muted text-xs font-semibold mr-1">Фильтр:</span>
            <label class="chip"><input type="radio" name="f" value="all" class="sr-only" checked>Все</label>
            <label class="chip"><input type="radio" name="f" value="excuse" class="sr-only">Отговорки</label>
            <label class="chip"><input type="radio" name="f" value="record" class="sr-only">Рекорды</label>
            <label class="chip"><input type="radio" name="f" value="fired" class="sr-only">Увольнения</label>
          </fieldset>

          
          <div id="posts" class="space-y-4"></div>

          
          <div id="posts-empty" class="card hidden py-12 text-center space-y-2">
            <img src="img/sloth.svg" alt="Ленивец" class="h-12 w-12 mx-auto object-contain opacity-60">
            <p class="font-bold text-sm">Здесь пока абсолютная тишина.</p>
            <p class="muted text-xs">Будьте первым, кто опубликует запись в этой категории.</p>
          </div>
        </section>

        
        <aside class="min-w-0 space-y-6" aria-label="Профиль и сообщество">
          <section id="me-card" class="card space-y-3.5 shadow-sm" aria-label="Мой профиль"></section>
          
          <section aria-labelledby="people-title" class="space-y-3">
            <div class="flex items-center justify-between">
              <h2 id="people-title" class="h3 text-sm font-bold uppercase tracking-wider text-brand-900 dark:text-slate-100">Кого читать</h2>
              <span class="text-xs text-brand-500 dark:text-gold font-semibold">+3 балла за подписку</span>
            </div>
            <div id="people" class="space-y-4"></div>
          </section>

          
          <section aria-label="Реклама">
            <div data-ad-slot="sidebar" data-label="Партнёрский блок" data-sublabel="Доставка горячей пиццы прямо на диван за 15 минут"></div>
          </section>
        </aside>
      </div>
    </main>
  </div>

  <script src="js/icons.js"></script>
  <script src="js/ad-slot.js"></script>
  <script src="js/data.js"></script>
  <script src="js/store.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/pages.js"></script>
</body>
</html>
