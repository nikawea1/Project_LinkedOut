<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <!-- High Contrast Badge: Visible on White, Dark Navy, Slate and Gold -->
  <circle cx="60" cy="60" r="56" fill="#1E1B4B" stroke="#E5A91B" stroke-width="3"/>
  <circle cx="60" cy="60" r="50" fill="#2E2880"/>
  
  <!-- Cozy Green Leaf on top -->
  <path d="M78 30 C88 22, 98 28, 94 38 C90 48, 80 44, 78 30 Z" fill="#10B981" stroke="#059669" stroke-width="1.5"/>
  <path d="M80 32 L92 36" stroke="#D1FAE5" stroke-width="1.2" stroke-linecap="round"/>

  <!-- Sloth Fur Body & Head -->
  <circle cx="60" cy="64" r="38" fill="#B45309" stroke="#E5A91B" stroke-width="2"/>
  
  <!-- Light Cream Face Mask -->
  <ellipse cx="60" cy="68" rx="28" ry="22" fill="#FEF3C7"/>
  
  <!-- Characteristic Sloth Eye Patches (Rich Dark Chocolate) -->
  <path d="M42 56 C36 56, 32 64, 34 72 C36 80, 46 80, 48 72 C50 66, 46 56, 42 56 Z" fill="#78350F"/>
  <path d="M78 56 C84 56, 88 64, 86 72 C84 80, 74 80, 72 72 C70 66, 74 56, 78 56 Z" fill="#78350F"/>
  
  <!-- Sleepy Happy Eyes (White Curves) -->
  <path d="M37 68 Q41 73 45 68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M75 68 Q79 73 83 68" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none"/>
  
  <!-- Cute Round Nose -->
  <ellipse cx="60" cy="74" rx="7" ry="5.5" fill="#1E1B4B"/>
  
  <!-- Peaceful Smiling Mouth -->
  <path d="M54 81 Q60 86 66 81" stroke="#451A03" stroke-width="2.8" stroke-linecap="round" fill="none"/>
  
  <!-- Golden Zzz for Zen Sleep -->
  <path d="M22 34 L30 34 L22 44 L30 44" stroke="#FBBF24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <path d="M34 22 L40 22 L34 28 L40 28" stroke="#FBBF24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
